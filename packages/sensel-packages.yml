name: Sensel packages and SDKs
summary: >-
  Sensel ships its developer surface as source on GitHub, not through a language package
  registry. LibSensel (the C core) and its language bindings are cloned or installed from
  per-platform installers committed to the sensel-api repository. No first-party Sensel package
  was found on npm, PyPI, RubyGems, crates.io, Maven Central, NuGet, pkg.go.dev or the Arduino
  Library Manager. Every first-party repository's last code push predates 2023, which is the
  clearest decay signal available for this provider.
distribution: source-and-installer
