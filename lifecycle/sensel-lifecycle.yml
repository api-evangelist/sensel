summary: >-
  Sensel publishes no versioning policy, no deprecation policy, no SLA and no status page for its
  API. The API itself is a source-distributed C library with no tags or releases, so there is no
  version identifier a consumer can pin. The dominant lifecycle fact is corporate: Cirque
  Corporation announced on 2025-04-22 that it had licensed Sensel's haptic forcepad technology and
  would take over direct customer support and development for the notebook PC market, and
  cirque.com/sensel now states Cirque acquired Sensel's key intellectual property, physical assets
  and trademarks. sensel.com 301-redirects to cirque.com/sensel and every path beneath sensel.com
  404s. Only guide.sensel.com and the GitHub organization remain as live Sensel-branded surfaces.
versioning:
  scheme: none
  documented: false
  evidence: >-
    The sensel-api repository publishes no git tags and no GitHub releases; guide.sensel.com
    carries no version banner (footer reads "Copyright 2017-2021 sensel"). The only versioned
    first-party artifact in the organization is sensel-controller-scripts (releases 1.0-1.2).
  note: >-
    LibSensel exposes senselGetFirmwareInfo() for DEVICE firmware version, but nothing reports the
    library's own version.
