aid: sensel
name: Sensel
description: >-
  Sensel is a Sunnyvale, California touch-input company founded in 2013 by Ilya Rosenberg and
  Aaron Zarraga, building high-resolution force-sensing hardware — the Morph pressure-sensitive
  input device and the force-sensing touchpad technology shipped in laptops such as Lenovo's
  ThinkPad X1 Titanium Yoga. Its developer surface is not a web API: the Sensel API is an
  open-source, MIT-licensed C library (LibSensel) that talks to Sensel devices over USB/serial,
  published at github.com/sensel/sensel-api with C, C#, Python, Arduino, Processing, Max and
  Pure Data bindings and documented at guide.sensel.com. Sensel's intellectual property,
  physical assets and trademarks were acquired by Cirque Corporation (an Alps Alpine company),
  and sensel.com now 301-redirects to cirque.com/sensel.
