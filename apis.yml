apis:
- name: Sensel API (LibSensel)
  description: >-
    The Sensel API is a C library for communicating with Sensel devices (Morph and Sensel
    sensor boards). It is a LOCAL DEVICE API, not an HTTP service: an application links
    LibSensel and LibSenselDecompress and opens the device over USB/serial, so there is no
    network base URL. The published surface is 44 senselXxx() calls covering device
    discovery/open/close, sensor info, scan mode and detail, frame allocation and reads,
    contact and force frames, LED control, firmware info and raw register access. Bindings
    are published for C, C#, Python, Arduino, Processing, Max (Cycling '74) and Pure Data.
  humanURL: https://guide.sensel.com/api/
  tags:
  - Touch Input
  - Force Sensing
  - Device SDK
  x-transport: local-library-usb-serial
  x-no-base-url-reason: >-
    LibSensel is linked into the host application and speaks to the device over USB/serial;
    the provider publishes no HTTP endpoint, so no baseURL exists to record.
